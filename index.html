<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤسسة الرؤيا المتقدمة - النظام السحابي الموحد</title>
    <!-- خط تجوال من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #121418;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background-color: #1e2229;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #2d333f;
            text-align: center;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 24px;
        }

        .tab-buttons {
            display: flex;
            background-color: #121418;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #9ca3af;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: #2b323d;
            color: #e28743;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #d1d5db;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background-color: #121418;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #e28743;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #e28743;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #c97232;
        }

        .hidden {
            display: none;
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
        }

        .alert-error {
            background-color: #450a0a;
            color: #fca5a5;
            border: 1px solid #7f1d1d;
        }

        .alert-success {
            background-color: #064e3b;
            color: #6ee7b7;
            border: 1px solid #065f46;
        }
    </style>

    <!-- Firebase App & Auth SDK (Version Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="auth-card">
        <h1 class="brand-title">مؤسسة الرؤيا المتقدمة</h1>
        <p class="brand-subtitle">النظام السحابي الموحد للإدارة والعمليات</p>

        <div class="tab-buttons">
            <button class="tab-btn" id="loginTabBtn" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn active" id="registerTabBtn" onclick="switchTab('register')">حساب جديد</button>
        </div>

        <div id="alertBox" class="alert"></div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" class="hidden" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" class="form-control" required placeholder="name@domain.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">تسجيل الدخول</button>
        </form>

        <!-- نموذج إنشاء حساب جديد -->
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="registerName" class="form-control" required placeholder="أدخل اسمك الكامل">
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="registerEmail" class="form-control" required placeholder="name@domain.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="registerPassword" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">إنشاء حساب جديد</button>
        </form>
    </div>

    <script>
        // إعدادات Firebase الخاصة بمشروع roya-app-29932
        const firebaseConfig = {
            apiKey: "AIzaSyBe6l5QOUONAU_lankplHs2YAHh1xUpKuQ",
            authDomain: "roya-app-29932.firebaseapp.com",
            projectId: "roya-app-29932",
            storageBucket: "roya-app-29932.firebasestorage.app",
            messagingSenderId: "612295279079",
            appId: "1:612295279079:web:e5d7b02f686e2eb23ebd42",
            measurementId: "G-XZRYEDLBFS"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // التبديل بين التبويبات
        function switchTab(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('loginTabBtn');
            const registerBtn = document.getElementById('registerTabBtn');
            hideAlert();

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.classList.add('active');
                registerBtn.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                loginBtn.classList.remove('active');
                registerBtn.classList.add('active');
            }
        }

        // إظهار التنبيهات
        function showAlert(message, isError = true) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            alertBox.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        // معالجة إنشاء حساب جديد
        async function handleRegister(e) {
            e.preventDefault();
            hideAlert();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                showAlert('تم إنشاء الحساب بنجاح!', false);
                console.log('User created:', userCredential.user);
            } catch (error) {
                showAlert(translateError(error.code));
            }
        }

        // معالجة تسجيل الدخول
        async function handleLogin(e) {
            e.preventDefault();
            hideAlert();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                showAlert('تم تسجيل الدخول بنجاح!', false);
                console.log('User logged in:', userCredential.user);
            } catch (error) {
                showAlert(translateError(error.code));
            }
        }

        // ترجمة أخطاء Firebase للعربية
        function translateError(code) {
            switch (code) {
                case 'auth/email-already-in-use':
                    return 'البريد الإلكتروني مستخدم بالفعل.';
                case 'auth/invalid-email':
                    return 'البريد الإلكتروني غير صالح.';
                case 'auth/weak-password':
                    return 'كلمة المرور ضعيفة (يجب أن تكون 6 خانات على الأقل).';
                case 'auth/user-not-found':
                case 'auth/wrong-password':
                case 'auth/invalid-credential':
                    return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
                case 'auth/api-key-not-valid':
                    return 'مفتاح الـ API غير صالح.';
                default:
                    return 'حدث خطأ: ' + code;
            }
        }
    </script>
</body>
</html>
